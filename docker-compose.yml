services:
  db:
    image: helpdesk-utp-db
    container_name: helpdesk-utp.db
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: helpdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  helpdesk-users:
    image: helpdesk-users
    container_name: helpdesk.users
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: helpdesk-users/Dockerfile
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Database=helpdesk;Username=postgres;Password=postgres
      Jwt__Issuer: helpdesk-utp
      Jwt__Audience: helpdesk-utp
      Jwt__Key: dev-only-helpdesk-utp-jwt-secret-32bytes
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost
    ports:
      - "5200:8080"

  helpdesk-tickets:
    image: helpdesk-tickets
    container_name: helpdesk.tickets
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: helpdesk-tickets/Dockerfile
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Database=helpdesk;Username=postgres;Password=postgres
      Notifications__ApiUrl: http://helpdesk-notifications:8080
      Jwt__Issuer: helpdesk-utp
      Jwt__Audience: helpdesk-utp
      Jwt__Key: dev-only-helpdesk-utp-jwt-secret-32bytes
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost
    ports:
      - "5201:8080"

  helpdesk-notifications:
    image: helpdesk-notifications
    container_name: helpdesk.notifications
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: helpdesk-notifications/Dockerfile
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Database=helpdesk;Username=postgres;Password=postgres
      Jwt__Issuer: helpdesk-utp
      Jwt__Audience: helpdesk-utp
      Jwt__Key: dev-only-helpdesk-utp-jwt-secret-32bytes
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost
    ports:
      - "5202:8080"

  frontend:
    image: helpdesk-utp-frontend
    container_name: helpdesk-utp.frontend
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_USERS_API_URL: /users-api
        VITE_TICKETS_API_URL: /tickets-api
        VITE_NOTIFICATIONS_API_URL: /notifications-api
    depends_on:
      - helpdesk-users
      - helpdesk-tickets
      - helpdesk-notifications
    ports:
      - "80:80"
 
 
volumes:
  postgres_data:
