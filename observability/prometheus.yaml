global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Optional: API metrics only work if each service exposes /metrics.
  - job_name: helpdesk-users
    static_configs:
      - targets: ["helpdesk-users:8080"]
    metrics_path: /metrics

  - job_name: helpdesk-tickets
    static_configs:
      - targets: ["helpdesk-tickets:8080"]
    metrics_path: /metrics

  - job_name: helpdesk-notifications
    static_configs:
      - targets: ["helpdesk-notifications:8080"]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
