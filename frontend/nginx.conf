server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    location /users-api/ {
        set $users_upstream helpdesk-users:8080;
        rewrite ^/users-api/(.*)$ /$1 break;
        proxy_pass http://$users_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tickets-api/ {
        set $tickets_upstream helpdesk-tickets:8080;
        rewrite ^/tickets-api/(.*)$ /$1 break;
        proxy_pass http://$tickets_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /notifications-api/ {
        set $notifications_upstream helpdesk-notifications:8080;
        rewrite ^/notifications-api/(.*)$ /$1 break;
        proxy_pass http://$notifications_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
