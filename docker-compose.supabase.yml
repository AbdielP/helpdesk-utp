services:
  helpdesk-users:
    image: helpdesk-users
    container_name: helpdesk.users
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: helpdesk-users/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION_STRING}
      Cors__AllowedOrigins__0: ${FRONTEND_DEV_ORIGIN:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${FRONTEND_DOCKER_ORIGIN:-http://localhost}
    ports:
      - "5200:8080"

  helpdesk-tickets:
    image: helpdesk-tickets
    container_name: helpdesk.tickets
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: helpdesk-tickets/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION_STRING}
      Notifications__ApiUrl: ${NOTIFICATIONS_API_URL:-http://helpdesk-notifications:8080}
      Cors__AllowedOrigins__0: ${FRONTEND_DEV_ORIGIN:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${FRONTEND_DOCKER_ORIGIN:-http://localhost}
    ports:
      - "5201:8080"

  helpdesk-notifications:
    image: helpdesk-notifications
    container_name: helpdesk.notifications
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: helpdesk-notifications/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION_STRING}
      Cors__AllowedOrigins__0: ${FRONTEND_DEV_ORIGIN:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${FRONTEND_DOCKER_ORIGIN:-http://localhost}
    ports:
      - "5202:8080"

  frontend:
    image: helpdesk-utp-frontend
    container_name: helpdesk-utp.frontend
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_USERS_API_URL: /users-api
        VITE_TICKETS_API_URL: /tickets-api
        VITE_NOTIFICATIONS_API_URL: /notifications-api
    depends_on:
      - helpdesk-users
      - helpdesk-tickets
      - helpdesk-notifications
    ports:
      - "80:80"
